<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شجرة العائلة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#2b2622;--mute:#7d756c;--line:#e4dccd;--green:#4a9f52;--m:#4a7fe8;--f:#d94f94;--link:#a9a39a;--red:#c8473d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1915;--card:#26231e;--ink:#f1ebe0;--mute:#a59d90;--line:#3a352d;--link:#6d675d}}
*{box-sizing:border-box}
html{height:100%}html,body{margin:0}
body{height:100dvh;height:var(--app-h,100dvh);background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.top{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:12px 14px 0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px}
.fam{display:flex;align-items:center;gap:12px;padding:12px 16px}
.fam svg{width:34px;height:34px;stroke:var(--green);fill:none;stroke-width:1.8;flex:none}
.fam b{font-size:22px;font-weight:800;display:block}
.fam small{color:var(--mute);font-size:16px}
.sq{width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 14px 'Tajawal';color:var(--ink);background:var(--card);cursor:pointer;position:relative}
.sq svg,.tool svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:6px;inset-inline-end:8px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;display:none;place-items:center;padding:0 5px}
.badge.on{display:grid}
.inv{margin:10px 14px 0;padding:12px 16px;display:flex;align-items:center;gap:14px}
.ring{width:62px;height:62px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.inv .t{flex:1}.inv .t b{font-size:20px;display:block}.inv .t span{color:var(--mute);font-size:15px}
.btn{background:var(--green);color:#fff;border:0;border-radius:16px;font:700 17px 'Tajawal';padding:12px 20px;cursor:pointer}
.btn.alt{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.btn.bad{background:var(--red)}.btn[disabled]{opacity:.45}
.stage{flex:1;position:relative;min-height:0;margin-top:6px}
.panel{flex:1;overflow:auto;padding:12px 14px;display:none}.panel.on{display:block}
#svg{width:100%;height:100%;touch-action:none;cursor:grab;display:block}
.node{cursor:pointer}.node.sel rect{stroke:var(--ink);stroke-width:3}.node.dim{opacity:.25}
.lbl{font:500 13px 'Tajawal';text-anchor:middle;pointer-events:none;fill:#fff}.note{font:500 7px 'Tajawal';text-anchor:middle;pointer-events:none;fill:var(--mute)}
.tools{display:none!important;position:absolute;right:10px;bottom:14px;width:74px;padding:4px 0;display:flex;flex-direction:column}
.tool{background:none;border:0;color:var(--ink);font:500 13px 'Tajawal';padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tool+.tool{border-top:1px solid var(--line)}
.nav{margin:6px 14px 12px;padding:8px 10px;display:flex;justify-content:space-around;border-radius:30px}
.nav button{background:none;border:0;color:var(--ink);font:500 14px 'Tajawal';display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 8px;border-radius:18px;cursor:pointer;position:relative}
.nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--green)}.nav button.on svg{background:var(--green);stroke:#fff;border-radius:14px;padding:10px;width:50px;height:50px;margin-top:-18px}
dialog{border:0;border-radius:22px;padding:20px;background:var(--card);color:var(--ink);width:min(92vw,380px);font-family:'Tajawal'}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 6px;font-size:20px}
.sub{color:var(--mute);font-size:15px;margin:0 0 10px}
label.l{display:block;font-size:15px;color:var(--mute);margin:10px 0 4px}
.f,select{width:100%;font:500 17px 'Tajawal';padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{padding:11px;border:1.5px solid var(--line);border-radius:12px;text-align:center;cursor:pointer}
.seg input{display:none}
.seg label:has(input:checked){border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent);font-weight:800}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.row .btn{flex:1;padding:12px}
.item{padding:12px 14px;margin-bottom:10px}
.item b{font-size:18px}.item p{margin:2px 0 8px;color:var(--mute);font-size:15px}
.item .row{margin-top:6px}
.tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:13px;margin-inline-start:6px}
.tag.wait{background:#f3e3b5;color:#6b5200}.tag.ok{background:#cfe9d1;color:#1f5a26}.tag.no{background:#f2cfcb;color:#7a2019}
h2{font-size:19px;margin:6px 0 10px}
.empty{color:var(--mute);text-align:center;padding:30px 10px;line-height:1.8}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
#toast.show{opacity:1}
.search{position:absolute;top:6px;left:14px;right:14px;display:none;z-index:2}.search.on{display:block}
.start{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;color:var(--mute);line-height:1.9}
.start.on{display:grid}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#login.on{display:flex}#login h1{margin:0;font-size:26px}#login p{margin:0;color:var(--mute)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4a9f52">
</head>
<body>
<div class="top">
  <div class="card fam">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6.5"/><path d="M12 22V10M12 15l-3-3M12 13l3-3"/></svg>
    <div><b id="famName">العائلة</b><small id="cnt"></small></div>
  </div>
  <button class="card sq" id="bNotif"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15zM10 21h4"/></svg>التنبيهات<span class="badge" id="bd1"></span></button>
  <button class="card sq" id="bShare"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.8"/><circle cx="17" cy="5.5" r="2.8"/><circle cx="17" cy="18.5" r="2.8"/><path d="M8.5 10.7l6-3.9M8.5 13.3l6 3.9"/></svg>مشاركة</button>
</div>
<div class="card inv">
  <div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="arc" cx="32" cy="32" r="28" fill="none" stroke="var(--green)" stroke-width="6" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="176"/></svg><b id="ringN">0</b></div>
  <div class="t"><b id="goalT"></b><span id="goalS">التالي: ادعُ قريبًا يساعدك</span></div>
  <button class="btn" id="bInvite">دعوة</button>
</div>

<div class="stage" id="stage">
  <div class="search" id="search"><input class="f" id="q" placeholder="ابحث عن اسم…"></div>
  <svg id="svg"><g id="vp"><g id="links"></g><g id="nodes"></g></g></svg>
  <div class="start" id="start"></div>
  <div class="card tools">
    <button class="tool" id="zi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>تكبير</button>
    <button class="tool" id="zo"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>تصغير</button>
    <button class="tool" id="fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>ملاءمة</button>
    <button class="tool" id="dir"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>اتجاه الشجرة</button>
    <button class="tool" id="add"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>إضافة فرد</button>
  </div>
</div>
<div class="panel" id="pReq"></div>
<div class="panel" id="pMore"></div>

<nav class="card nav">
  <button data-t="more"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>المزيد</button>
  <button data-t="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>بحث</button>
  <button class="on" data-t="tree"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M12 22V10M12 15l-3-3M12 13l3-3"/></svg>الشجرة</button>
  <button data-t="req"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg>الطلبات<span class="badge" id="bd2"></span></button>
  <button data-t="content"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>محتوى العائلة</button>
</nav>

<dialog id="dEdit">
  <h3>تعديل فرد</h3>
  <label class="l" for="eName">الاسم</label><input class="f" id="eName" autocomplete="off" maxlength="40">
  <label class="l">الجنس</label>
  <div class="seg"><label><input type="radio" name="eg" value="m" checked><span>ذكر</span></label><label><input type="radio" name="eg" value="f"><span>أنثى</span></label></div>
  <label class="l">الحالة</label>
  <div class="seg"><label><input type="radio" name="ed" value="a" checked><span>حيّ</span></label><label><input type="radio" name="ed" value="d"><span>متوفى</span></label></div>
  <div id="eExtBox"><label class="l">الزواج</label>
  <div class="seg"><label><input type="radio" name="ex" value="n" checked><span>غير ذلك</span></label><label><input type="radio" name="ex" value="y"><span>متزوجة من خارج العائلة</span></label></div>
  <div id="eKidsBox"><label class="l" for="eKids">أبناؤها (اسم في كل سطر)</label><textarea class="f" id="eKids" rows="4" style="width:100%;box-sizing:border-box;resize:vertical"></textarea></div></div>
  <div id="eMarBox"><label class="l">الحالة الزوجية</label>
  <div class="seg"><label><input type="radio" name="em" value="m" checked><span>متزوج</span></label><label><input type="radio" name="em" value="d"><span>مطلّق</span></label></div></div>
  <div class="row"><button class="btn" id="eOk">حفظ</button><button class="btn alt" id="eNo">إلغاء</button></div>
</dialog>
<dialog id="dPar">
  <h3>إضافة والد</h3><p class="sub" id="pSub"></p>
  <label class="l" for="pName">اسم الوالد</label><input class="f" id="pName" autocomplete="off" maxlength="40">
  <div class="row"><button class="btn" id="pOk">إضافة</button><button class="btn alt" id="pNo">إلغاء</button></div>
</dialog>
<dialog id="dInfo">
  <h3 id="iName"></h3><p class="sub" id="iRel"></p>
  <div id="iKids" style="display:none;margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.7"></div>
  <div class="row" id="iBtns"></div>
</dialog>
<dialog id="dAdd">
  <h3 id="aTitle">إضافة فرد</h3><p class="sub" id="aSub"></p>
  <div id="aTypeBox"><label class="l">نوع الإضافة</label>
  <div class="seg"><label><input type="radio" name="ty" value="child" checked><span>ابن / ابنة</span></label><label><input type="radio" name="ty" value="spouse"><span>زوج / زوجة</span></label></div></div>
  <label class="l" for="aName">الاسم</label><input class="f" id="aName" autocomplete="off" maxlength="40">
  <label class="l">الجنس</label>
  <div class="seg"><label><input type="radio" name="g" value="m" checked><span>ذكر</span></label><label><input type="radio" name="g" value="f"><span>أنثى</span></label></div>
  <div id="aTargetBox"><label class="l" for="aTarget" id="aTL"></label><select id="aTarget"></select></div>
  <div class="row"><button class="btn" id="aOk">إرسال</button><button class="btn alt" id="aNo">إلغاء</button></div>
</dialog>
<div id="toast" role="status"></div>

<div id="login"><h1>شجرة العائلة</h1><p>سجّل الدخول لعرض الشجرة والمشاركة فيها</p><button class="btn" id="loginBtn">الدخول بحساب Google</button></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null,user=null,uid=null,isAdmin=false,canWrite=false;
let P=[],REJ=new Set(),DEL=new Set(),SET={limit:0,name:'العائلة'},ALL=[],horiz=false,sel=null,q='',tab='tree',pos={},fitted=false,busy=false;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
const rel=p=>p.type==='root'?'أصل العائلة':p.type==='spouse'?(p.g==='m'?'زوج':'زوجة'):(p.g==='m'?'ابن':'ابنة');
const byId=id=>P.find(p=>p.id===id);
const status=it=>P.some(p=>p.id===it.rid)?'ok':REJ.has(it.rid)?'no':'wait';
const waiting=()=>ALL.filter(it=>status(it)==='wait');
const mine=()=>ALL.filter(it=>it.uid===uid);

/* ---------- layout ---------- */
const W=64,H=26,GX=10,GY=70;
function layout(){
  const slot=horiz?H+GX:W+GX;
  const ord=(a,b)=>(a.ts||0)-(b.ts||0)||(a.id<b.id?-1:1);
  const kids=id=>P.filter(p=>p.type==='child'&&p.p===id).sort(ord);
  const sps=id=>P.filter(p=>p.type==='spouse'&&p.s===id).sort(ord);
  const root=P.find(p=>p.type==='root');if(!root)return {};
  function build(p,d){
    const sp=sps(p.id),cw=(1+sp.length)*slot;
    const ks=kids(p.id).map(c=>build(c,d+1));
    let cur=0;ks.forEach(r=>{r.off=cur;cur+=r.w});
    const w=Math.max(cur,cw),shift=(w-cur)/2;
    let c=ks.length?((ks[0].off+ks[0].pc)+(ks[ks.length-1].off+ks[ks.length-1].pc))/2+shift:w/2;
    const start=Math.min(Math.max(c-cw/2,0),w-cw);c=start+cw/2;
    const items=[];
    ks.forEach(r=>r.items.forEach(i=>items.push({...i,a:i.a+r.off+shift,cc:i.cc==null?null:i.cc+r.off+shift})));
    const pc=start+slot/2;
    items.push({id:p.id,a:pc,d,cc:c});
    sp.forEach((s,i)=>items.push({id:s.id,a:start+(i+1.5)*slot,d,cc:null}));
    return {w,items,pc};
  }
  const r=build(root,0),out={};
  r.items.forEach(i=>{
    out[i.id]=horiz?{x:-i.d*(W+GY),y:i.a,cx:-i.d*(W+GY),cy:i.cc}:{x:-i.a,y:i.d*(H+GY),cx:i.cc==null?null:-i.cc,cy:i.d*(H+GY)};
  });
  return out;
}
function el(n,a,p){const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
function renderTree(){
  pos=layout();const L=$('links'),N=$('nodes');L.innerHTML='';N.innerHTML='';
  const has=P.length>0&&Object.keys(pos).length>0;
  const st=$('start');
  if(!has){
    st.classList.add('on');
    st.innerHTML=isAdmin?'<div>الشجرة فارغة.<br><button class="btn" id="mkRoot" style="margin-top:12px">ابدأ الشجرة</button></div>':'<div>لم تبدأ الشجرة بعد.<br>سيبدؤها مشرف العائلة قريبًا.</div>';
    const b=$('mkRoot');if(b)b.onclick=()=>openAdd({root:true});
    return;
  }
  st.classList.remove('on');
  const hasQ=q.trim().length>0;
  for(const p of P){
    const a=pos[p.id];if(!a)continue;
    if(p.type==='child'&&pos[p.p]){
      const b=pos[p.p];let d;
      if(horiz){const x0=b.x-W/2,y0=b.cy,x1=a.x+W/2,y1=a.y;d=`M${x0} ${y0}C${x0-35} ${y0} ${x1+35} ${y1} ${x1} ${y1}`}
      else{const x0=b.cx,y0=b.y+H/2,x1=a.x,y1=a.y-H/2;d=`M${x0} ${y0}C${x0} ${y0+30} ${x1} ${y1-30} ${x1} ${y1}`}
      el('path',{d,fill:'none',stroke:'var(--link)','stroke-width':1.4},L);
    }
    if(p.type==='spouse'&&pos[p.s]){const b=pos[p.s];el('line',p.div?{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'var(--red)','stroke-width':2,'stroke-dasharray':'4 3'}:{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'var(--link)','stroke-width':3},L)}
  }
  for(const p of P){
    const o=pos[p.id];if(!o)continue;
    const hit=hasQ&&(p.name.includes(q.trim())||(p.extKids||[]).some(k=>k.includes(q.trim())));
    const g=el('g',{class:'node'+(sel===p.id?' sel':'')+(hasQ&&!hit?' dim':''),transform:`translate(${o.x-W/2} ${o.y-H/2})`},N);
    el('rect',{width:W,height:H,rx:4,fill:p.dead?'#8c939b':(p.g==='m'?'var(--m)':'var(--f)')},g);
    const notes=[];
    if(p.ext){notes.push('من خارج العائلة');const n=(p.extKids||[]).length;if(n)notes.push('أبناؤها: '+n)}
    if(p.div)notes.push(p.g==='m'?'مطلق':'مطلقة');
    if(p.dead)notes.push(p.g==='m'?'رحمه الله':'رحمها الله');
    notes.forEach((n,i)=>{const nt=el('text',{class:'note',x:W/2,y:H+8+i*8},g);nt.textContent=n});
    const t=el('text',{class:'lbl',x:W/2,y:H/2+4.5},g);t.textContent=p.name.length>9?p.name.slice(0,8)+'…':p.name;
    g.addEventListener('click',()=>{if(!moved)openInfo(p)});
  }
  if(!fitted){fitted=true;requestAnimationFrame(fit)}
}
/* ---------- view ---------- */
let view={x:0,y:0,k:1};
function apply(){$('vp').setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`)}
function fit(){
  const ids=Object.keys(pos);if(!ids.length||tab!=='tree')return;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  ids.forEach(id=>{const o=pos[id];x0=Math.min(x0,o.x-W/2);x1=Math.max(x1,o.x+W/2);y0=Math.min(y0,o.y-H/2);y1=Math.max(y1,o.y+H/2)});
  const r=$('svg').getBoundingClientRect(),pad=24;
  const k=Math.min((r.width-pad*2)/(x1-x0),(r.height-pad*2)/(y1-y0),2.2);
  view={k,x:r.width/2-k*(x0+x1)/2,y:horiz?(r.height-k*(y1-y0))/2-k*y0:pad+30-k*y0};apply();
}
function zoom(f,cx,cy){
  const r=$('svg').getBoundingClientRect();cx=cx??r.width/2;cy=cy??r.height/2;
  const k=Math.min(4,Math.max(.15,view.k*f)),s=k/view.k;view.x=cx-(cx-view.x)*s;view.y=cy-(cy-view.y)*s;view.k=k;apply();
}
let ptrs=new Map(),moved=false,lastD=0,start0=null;const sv=$('svg');
sv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;start0={x:e.clientX,y:e.clientY};lastD=0});
sv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const o=ptrs.get(e.pointerId),n={x:e.clientX,y:e.clientY};
  if(Math.hypot(n.x-start0.x,n.y-start0.y)>6)moved=true;if(!moved)return;
  if(ptrs.size===1){view.x+=n.x-o.x;view.y+=n.y-o.y;apply()}
  ptrs.set(e.pointerId,n);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(lastD){const r=sv.getBoundingClientRect();zoom(d/lastD,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top)}lastD=d}
});
const up=e=>{ptrs.delete(e.pointerId);lastD=0;setTimeout(()=>{if(!ptrs.size)moved=false},0)};
sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',up);
sv.addEventListener('wheel',e=>{e.preventDefault();const r=sv.getBoundingClientRect();zoom(e.deltaY<0?1.12:.9,e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('zi').onclick=()=>zoom(1.3);$('zo').onclick=()=>zoom(1/1.3);$('fit').onclick=fit;
$('dir').onclick=()=>{horiz=!horiz;renderTree();fit();toast(horiz?'الشجرة أفقية':'الشجرة عمودية')};

/* ---------- stats ---------- */
function stats(){
  const n=P.length,lim=+SET.limit||0;
  $('famName').textContent=SET.name||'العائلة';
  $('cnt').textContent=lim?`${n} من ${lim} فرد`:`${n} فرد`;
  const goal=lim||([10,30,100,250,500,1000,5000].find(t=>t>n)||n);
  $('ringN').textContent=n;
  $('goalT').textContent=lim?`${n} من ${lim} فردًا`:`${n} فردًا في العائلة`;
  $('goalS').textContent=lim?'الحد الأقصى الذي اختاره المشرف':'عدد الأفراد غير محدود';
  $('arc').style.strokeDashoffset=176*(1-Math.min(1,n/goal));
  const w=isAdmin?waiting().length:0;
  ['bd1','bd2'].forEach(i=>{const b=$(i);b.textContent=w;b.classList.toggle('on',w>0)});
  $('add').style.display=canWrite?'':'none';
}

/* ---------- dialogs ---------- */
function openInfo(p){
  $('iName').textContent=p.name;$('iRel').textContent=[rel(p),p.div?(p.g==='m'?'مطلق':'مطلقة'):'',p.dead?(p.g==='m'?'متوفى':'متوفاة'):''].filter(Boolean).join(' · ');
  const kb=$('iKids');kb.innerHTML='';kb.style.display='none';
  if(p.ext){
    kb.style.display='';
    const h=document.createElement('div');h.style.fontWeight='700';h.textContent='متزوجة من خارج العائلة';kb.appendChild(h);
    const ks=p.extKids||[],d=document.createElement('div');d.style.color='var(--mute)';
    d.textContent=ks.length?('أبناؤها: '+ks.join('، ')):'لم تُسجَّل أسماء أبنائها بعد';kb.appendChild(d);
  }
  const b=$('iBtns');b.innerHTML='';
  const mk=(t,cls,fn)=>{const x=document.createElement('button');x.className='btn '+cls;x.textContent=t;x.onclick=fn;b.appendChild(x)};
  if(canWrite){
    mk('إضافة ابن / ابنة','',()=>{$('dInfo').close();openAdd({type:'child',target:p.id})});
    if(p.type!=='spouse')mk('إضافة زوج / زوجة','',()=>{$('dInfo').close();openAdd({type:'spouse',target:p.id})});
  }
  if(isAdmin&&p.type==='root')mk('إضافة والد','',()=>{$('dInfo').close();openPar(p)});
  if(isAdmin){
    mk('تعديل','alt',()=>{$('dInfo').close();openEdit(p)});
    mk('حذف','bad',()=>{$('dInfo').close();delPerson(p)});
  }
  mk('إغلاق','alt',()=>$('dInfo').close());
  $('dInfo').showModal();
}
function fillTargets(type,pre){
  const s=$('aTarget');s.innerHTML='';
  P.filter(p=>type==='child'||p.type!=='spouse').forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name+' — '+rel(p);s.appendChild(o)});
  if(pre&&byId(pre)&&[...s.options].some(o=>o.value===pre))s.value=pre;
  $('aTL').textContent=type==='child'?'الابن أو الابنة لـ':'الزوج أو الزوجة لـ';
}
let addCtx={};
function openAdd(ctx){
  addCtx=ctx||{};
  if(!canWrite){toast('تحتاج إلى صلاحية مشاركة من المشرف');return}
  const root=!!addCtx.root;
  $('aTitle').textContent=root?'أصل العائلة':'إضافة فرد';
  $('aSub').textContent=root?'اكتب اسم أول فرد في الشجرة.':(isAdmin?'تُضاف مباشرة لأنك مشرف.':'سيصل طلبك إلى المشرف وتظهر الإضافة بعد موافقته.');
  $('aTypeBox').style.display=root?'none':'';$('aTargetBox').style.display=root?'none':'';
  $('aName').value='';
  document.querySelector(`input[name=ty][value=${addCtx.type||'child'}]`).checked=true;
  document.querySelector('input[name=g][value=m]').checked=true;

document.querySelectorAll('input[name=ty]').forEach(r=>r.onchange=()=>fillTargets(r.value,$('aTarget').value));
$('aNo').onclick=()=>$('dAdd').close();
function capReached(){
  const lim=+SET.limit||0;if(!lim)return false;
  return P.length+(isAdmin?0:mine().filter(i=>status(i)==='wait').length)>=lim;
}
$('aOk').onclick=async()=>{

/* ---------- edit / delete (admin) ---------- */
let editId=null;
function openEdit(p){
  editId=p.id;$('eName').value=p.name;

function syncEdit(){
  const cur=byId(editId),f=document.querySelector('input[name=eg]:checked').value==='f';

$('eNo').onclick=()=>$('dEdit').close();
$('eOk').onclick=async()=>{

let parFor=null;
function openPar(p){
  parFor=p;$('pSub').textContent='والد «'+p.name+'»';$('pName').value='';
  $('dPar').showModal();setTimeout(()=>$('pName').focus(),50);
}
$('pNo').onclick=()=>$('dPar').close();
$('pOk').onclick=async()=>{
  if(busy||!isAdmin||!parFor)return;
  const name=$('pName').value.trim();if(!name){toast('اكتب الاسم أولًا');return}
  if(capReached()){toast('وصلت الشجرة إلى الحد الأقصى ('+SET.limit+')');return}
  const rid='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  busy=true;
  try{
    const b=db.batch();
    b.set(db.doc('people/'+rid),{name,g:'m',type:'root',p:null,p2:null,s:null,ts:Date.now(),by:uid});
    b.update(db.doc('people/'+parFor.id),{type:'child',p:rid});
    await b.commit();
    toast('تمت إضافة الوالد');$('dPar').close();fitted=false;
  }catch(e){toast('تعذّر الإضافة')}
  busy=false;
};
function subtree(id){
  const out=new Set([id]),q=[id];
  while(q.length){const x=q.pop();
    P.forEach(p=>{if(!out.has(p.id)&&(p.s===x||p.p===x)){out.add(p.id);q.push(p.id)}})}
  return [...out];
}
async function delPerson(p){
  if(busy||!isAdmin)return;
  const ids=subtree(p.id);
  const msg=ids.length>1?`سيتم حذف «${p.name}» مع ${ids.length-1} من أزواجه وأبنائه وأحفاده. هذا لا يمكن التراجع عنه. متأكد؟`:`حذف «${p.name}» نهائيًا؟ لا يمكن التراجع عن ذلك.`;
  if(!confirm(msg))return;
  busy=true;
  try{
    for(let i=0;i<ids.length;i+=200){
      const b=db.batch();
      ids.slice(i,i+200).forEach(id=>{b.delete(db.doc('people/'+id));b.set(db.doc('rejected/'+id),{ts:Date.now(),del:true})});
      await b.commit();
    }
    if(ids.includes(sel))sel=null;
    toast('تم الحذف');
  }catch(e){toast('تعذّر الحذف')}
  busy=false;
}


/* ---------- panels ---------- */
const names={};
async function resolve(){ALL.forEach(i=>{if(i.uname)names[i.uid]=i.uname});paintNames()}
function paintNames(){document.querySelectorAll('[data-u]').forEach(s=>s.textContent=names[s.dataset.u]||'عضو')}
function line(it){
  const t=byId(it.p2||it.p||it.s);
  const r=it.type==='spouse'?(it.g==='m'?'زوج':'زوجة'):(it.g==='m'?'ابن':'ابنة');
  return `${r} ${t?esc(t.name):'—'}`;
}
function renderReq(){
  const box=$('pReq');let h='';
  if(isAdmin){
    const w=waiting().sort((a,b)=>a.ts-b.ts);
    h+=`<h2>بانتظار موافقتك (${w.length})</h2>`;
    if(!w.length)h+='<div class="empty">لا توجد طلبات جديدة.</div>';
    w.forEach(it=>{
      const ok=it.type==='root'||byId(it.p||it.s);
      h+=`<div class="card item"><b>${esc(it.name)}</b><p>${line(it)} · أضافه <span data-u="${esc(it.uid)}">…</span></p>
      <div class="row"><button class="btn" data-ap="${esc(it.rid)}" ${ok?'':'disabled'}>موافقة</button><button class="btn bad" data-rj="${esc(it.rid)}">رفض</button></div></div>`;
    });
    resolve([...new Set(w.map(i=>i.uid))]);
  }else{
    const m=mine().sort((a,b)=>b.ts-a.ts);
    h+=`<h2>طلباتك</h2>`;
    if(!m.length)h+='<div class="empty">لم ترسل أي طلب بعد.<br>اضغط على أي اسم في الشجرة لإضافة ابن أو زوجة.</div>';
    m.forEach(it=>{const s=status(it);h+=`<div class="card item"><b>${esc(it.name)}</b><span class="tag ${s}">${s==='ok'?'تمت الموافقة':s==='no'?(DEL.has(it.rid)?'محذوف':'مرفوض'):'قيد المراجعة'}</span><p>${line(it)}</p></div>`});
  }
  box.innerHTML=h;
}
$('pReq').addEventListener('click',async e=>{
  const a=e.target.closest('[data-ap]'),r=e.target.closest('[data-rj]');if(!a&&!r||!db||busy)return;
  const rid=(a||r).dataset.ap||(a||r).dataset.rj,it=ALL.find(x=>x.rid===rid);if(!it)return;
  busy=true;
  try{
    if(a){const doc={name:it.name,g:it.g,type:it.type,p:it.p,p2:it.p2,s:it.s,by:it.uid,ts:it.ts};await db.doc('people/'+rid).set(doc);toast('تمت الموافقة')}
    else{await db.doc('rejected/'+rid).set({ts:Date.now()});toast('تم الرفض')}
  }catch(err){toast('تعذّر تنفيذ العملية')}
  busy=false;
});
function renderMore(){
  const box=$('pMore');
  let h=`<div class="card item"><b>${isAdmin?'أنت مشرف':canWrite?'أنت عضو':'عرض فقط'}</b><p>${isAdmin?'توافق على طلبات الإضافة أو ترفضها.':canWrite?'تضيف الأبناء والأزواج، وتظهر الإضافة بعد موافقة المشرف.':'اطلب من المشرف صلاحية المشاركة لتتمكن من الإضافة.'}</p></div>
  <div class="card item"><b>قواعد الشجرة</b><p>التعديل والحذف للمشرف فقط.</p></div>`;
  if(isAdmin){
    h+=`<div class="card item"><b>إعدادات المشرف</b>
    <label class="l" for="sName">اسم العائلة</label><input class="f" id="sName" maxlength="30" value="${esc(SET.name||'')}">
    <label class="l" for="sLim">عدد الأفراد</label>
    <select id="sLim"><option value="0">غير محدود</option><option value="30">حتى 30 فردًا</option><option value="100">حتى 100 فرد</option></select>
    <div class="row"><button class="btn" id="sSave">حفظ</button></div></div>`;
  }
  box.innerHTML=h;
  if(isAdmin){
    const l=$('sLim');l.value=String(+SET.limit||0);
    $('sSave').onclick=async()=>{try{await db.doc('settings/main').set({name:$('sName').value.trim()||'العائلة',limit:+$('sLim').value});toast('تم الحفظ')}catch(e){toast('تعذّر الحفظ')}};
  }
}
/* ---------- nav ---------- */

  tab=t;

$('bNotif').onclick=()=>show('req');
$('q').addEventListener('input',e=>{q=e.target.value;renderTree()});
async function share(){
  const text=`انضم إلى شجرة عائلة ${SET.name||''} وأضف أبناءك وزوجاتك.`;
  try{if(navigator.share){await navigator.share({title:'شجرة العائلة',text,url:location.href});return}}catch(e){return}
  try{await navigator.clipboard.writeText(text+' '+location.href);toast('تم نسخ الدعوة')}catch(e){toast(text)}
}
$('bShare').onclick=share;$('bInvite').onclick=share;

function renderAll(){stats();renderTree();if(tab==='req')renderReq();if(tab==='more'&&!document.activeElement.closest('#pMore'))renderMore()}

let unsubs=[];
const stopListen=()=>{unsubs.forEach(f=>f());unsubs=[]};
function startListen(){
  const err=e=>{console.error(e);toast('تعذّر قراءة البيانات')};
  unsubs.push(db.collection('people').onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},err));
  unsubs.push(db.collection('rejected').onSnapshot(s=>{REJ=new Set(s.docs.map(d=>d.id));DEL=new Set(s.docs.filter(d=>d.data().del).map(d=>d.id));renderAll()},err));
  unsubs.push(db.doc('settings/main').onSnapshot(s=>{if(s.exists)SET={...SET,...s.data()};renderAll()},err));
  if(isAdmin){
    unsubs.push(db.collection('pending').onSnapshot(s=>{
      ALL=[];s.docs.forEach(d=>(d.data().items||[]).forEach(it=>ALL.push({...it,uid:d.id})));renderAll();
    },err));
  }else{
    unsubs.push(db.doc('pending/'+uid).onSnapshot(s=>{
      ALL=[];if(s.exists)(s.data().items||[]).forEach(it=>ALL.push({...it,uid}));renderAll();
    },err));
  }
}
auth.onAuthStateChanged(u=>{
  stopListen();
  if(!u){uid=null;isAdmin=false;canWrite=false;P=[];ALL=[];REJ=new Set();DEL=new Set();$('login').classList.add('on');renderAll();return}
  uid=u.uid;
  isAdmin=u.emailVerified&&ADMIN_EMAILS.includes((u.email||'').toLowerCase());
  canWrite=true;
  $('login').classList.remove('on');
  startListen();renderAll();
});
$('loginBtn').onclick=()=>{
  const p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(e=>{
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(p);
    else toast('تعذّر تسجيل الدخول');
  });
};
